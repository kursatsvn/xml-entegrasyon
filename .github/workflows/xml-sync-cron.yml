name: Manual XML Sync & AI Compliance Guard (Backup Trigger)

on:
  # Ana 3 saatlik zamanlayıcı artık Supabase pg_cron + pg_net üzerinde %100 dakik çalışmaktadır.
  # Bu workflow çakışma olmaması için yalnızca isteğe bağlı manuel tetikleyici (workflow_dispatch) olarak bırakılmıştır.
  workflow_dispatch:

jobs:
  trigger-xml-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Production XML & AI Compliance Sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'https://xml-entegrasyon-orcin.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET gizli değişkeni GitHub Actions Secrets altında tanımlanmalıdır."
            exit 1
          fi
          echo "Triggering XML sync on ${APP_BASE_URL}/api/cron/sync ..."
          curl -s -S -L --fail-with-body --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL}/api/cron/sync"
